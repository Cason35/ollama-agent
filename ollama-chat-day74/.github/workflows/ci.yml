# 第74天：定义生产发布候选版持续集成流水线名称。
name: Day74 Production CI

# 第74天：声明推送和拉取请求都会触发流水线。
on:
  # 第74天：监听任意分支代码推送。
  push:
  # 第74天：监听任意拉取请求更新。
  pull_request:

# 第74天：限制同一分支只保留最新流水线运行。
concurrency:
  # 第74天：按工作流和分支生成并发组。
  group: day74-${{ github.workflow }}-${{ github.ref }}
  # 第74天：新提交到来时取消旧运行。
  cancel-in-progress: true

# 第74天：定义代码质量、测试、构建和镜像验证任务。
jobs:
  # 第74天：声明生产验证任务。
  verify:
    # 第74天：使用 GitHub 托管 Ubuntu 环境。
    runs-on: ubuntu-latest
    # 第74天：设置只读仓库权限。
    permissions:
      # 第74天：允许读取源代码。
      contents: read
    # 第74天：定义按顺序执行的流水线步骤。
    steps:
      # 第74天：检出当前提交代码。
      - name: Checkout source
        # 第74天：使用官方代码检出动作。
        uses: actions/checkout@v4
      # 第74天：安装并缓存 Node.js 22。
      - name: Setup Node.js
        # 第74天：使用官方 Node.js 环境动作。
        uses: actions/setup-node@v4
        # 第74天：配置 Node.js 版本与 npm 缓存。
        with:
          # 第74天：声明 Node.js 主版本。
          node-version: 22
          # 第74天：启用 npm 下载缓存。
          cache: npm
      # 第74天：按锁文件安装依赖。
      - name: Install dependencies
        # 第74天：使用 npm ci 保证依赖可复现。
        run: npm ci
      # 第74天：执行 ESLint 代码规范检查。
      - name: Lint
        # 第74天：运行项目 lint 脚本。
        run: npm run lint
      # 第74天：执行严格 TypeScript 类型检查。
      - name: Type check
        # 第74天：运行无产物类型检查。
        run: npm run typecheck
      # 第74天：执行 Day64 至 Day74 回归测试。
      - name: Automated tests
        # 第74天：运行统一测试流水线。
        run: npm run test:all
      # 第74天：生成 Next.js 生产构建。
      - name: Production build
        # 第74天：运行 standalone 生产构建。
        run: npm run build
      # 第74天：验证多阶段 Dockerfile 可以成功构建镜像。
      - name: Docker build
        # 第74天：构建不推送的发布候选镜像。
        run: docker build --tag ollama-chat-day74:${{ github.sha }} .
